<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angus Burger Wembley | Closed for Maintenance</title>
    <meta name="description" content="Angus Burger Wembley is closed for maintenance until further notice.">
    <meta name="theme-color" content="#171717">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: #171717;
            background-image: radial-gradient(circle at 50% 0%, rgba(234, 88, 12, 0.18), transparent 60%);
            color: #fafafa;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            text-align: center;
        }

        main {
            max-width: 560px;
        }

        .logo {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            margin: 0 auto 28px;
            display: block;
        }

        .eyebrow {
            margin: 0;
            color: #EA580C;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
        }

        h1 {
            margin: 16px 0 20px;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: clamp(2.25rem, 9vw, 3.75rem);
            line-height: 1.05;
            letter-spacing: -0.01em;
            text-transform: uppercase;
        }

        h1 span {
            color: #EA580C;
        }

        .lead {
            margin: 0 auto;
            max-width: 440px;
            color: #d4d4d4;
            font-size: 1.0625rem;
            line-height: 1.6;
        }

        .divider {
            width: 48px;
            height: 3px;
            margin: 32px auto 0;
            border-radius: 2px;
            background: #EA580C;
        }
    </style>
</head>

<body>
    <main>
        <img class="logo" src="/icons/icon-192x192.png" alt="" width="72" height="72">
        <p class="eyebrow">Angus Burger &middot; Wembley</p>
        <h1>Closed for <span>maintenance</span></h1>
        <p class="lead">
            We're closed until further notice while we carry out some work.
            Thank you for your patience &mdash; we'll update this page when we reopen.
        </p>
        <div class="divider" aria-hidden="true"></div>
    </main>
</body>

</html>
